baseURL = "https://chapi.to/"
title = "Chapitô"
locale = "fr-FR"
defaultContentLanguage = "fr"
# /solutions.html (servi en /solutions par les hébergeurs statiques, comme sur Webflow)
uglyURLs = true
disableKinds = ["RSS", "taxonomy", "term", "section"]
enableRobotsTXT = true
disableHugoGeneratorInject = true

[security]
# Hugo >= 0.164 refuse par défaut les pages de contenu en HTML
allowContent = ["^text/(markdown|html)$"]

