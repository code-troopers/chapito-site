{{ if site.Params.brevoFormAction }}
<script>
// Inscription newsletter (Brevo) : envoi en arrière-plan, puis message de confirmation
document.addEventListener('DOMContentLoaded', function () {
  var form = document.getElementById('newsletter-form');
  if (!form) return;
  var box = form.closest('.newsletter-form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = form.querySelector('[type=submit]');
    btn.value = 'Ça arrive...';
    fetch(form.action, { method: 'POST', body: new FormData(form), mode: 'no-cors' })
      .then(function () { form.style.display = 'none'; box.querySelector('.w-form-done').style.display = 'block'; })
      .catch(function () { box.querySelector('.w-form-fail').style.display = 'block'; btn.value = "C'est parti !"; });
  });
});
</script>
{{ end }}
